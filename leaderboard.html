<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake - Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container board">
    <h1>Leaderboard</h1>
    <div class="tabs">
      <button id="tabTop">Top Skor</button>
      <button id="tabRecent" class="secondary">Riwayat</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Nama</th><th>Skor</th><th>Panjang</th><th>Waktu</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="hint" id="empty" hidden>Belum ada data. Mainkan satu ronde dulu.</p>
    <div class="controls">
      <a class="btn" href="index.html">Main</a>
      <a class="btn secondary" href="menu.html">Menu</a>
      <button id="clearBtn" class="secondary">Hapus data</button>
    </div>
  </main>
  <script src="storage.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
